schema_version: 1

context:
  name: aimsgb
  version: "1.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/aimsgb-${{ version }}.tar.gz
  sha256: 4fc39da404a988d0e2fa34e0222570279a9607fe85b16ede2012c215bcc4c075

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - aimsgb = aimsgb.agb:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=18.0
    - pip
  run:
    - python >=${{ python_min }}
    - pymatgen
    - mp-api
    - numpy
    - pytest

tests:
  - python:
      imports:
        - aimsgb
      pip_check: true
      python_version: ${{ python_min }}
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - aimsgb --help

about:
  summary: aimsgb is a python library for generatng the atomic coordinates of periodic grain boundaries.Copyright © 2018 The Regents of the University of California.All Rights Reserved. See more in Copyright.
  license: BSD-4-Clause
  license_file:
    - COPYRIGHT.rst
  homepage: http://aimsgb.org

extra:
  recipe-maintainers:
    - jan-janssen
